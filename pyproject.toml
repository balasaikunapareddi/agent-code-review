[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-review"
version = "0.1.0"
description = "Pydantic AI code-review agent with production patterns: deterministic static checks under the LLM layer, structured findings with severity + confidence, false-positive suppression, and a seeded-bug eval benchmark. Mock-first: no API key, no network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "pydantic>=2",
    "pydantic-ai-slim>=1.0",
]

[project.optional-dependencies]
live = ["pydantic-ai-slim[google]>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
code-review-demo = "agent_code_review.demo:main"
code-review-eval = "agent_code_review.evals:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
